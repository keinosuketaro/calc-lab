[project]
name = "calc-lab"
version = "0.1.0"
description = "Claude Code で体験する最先端の AI コーディング（学習用）"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "calc"

[dependency-groups]
dev = ["pytest", "ruff", "mcp[cli]", "claude-agent-sdk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
