[project]
name = "calc-lab"
version = "0.1.0"
description = "Claude Code で体験する最先端の AI コーディング（学習用）"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "calc"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mcp[cli]",
    "claude-agent-sdk",
    "playwright>=1.63.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
